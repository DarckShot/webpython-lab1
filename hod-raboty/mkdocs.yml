site_name: Лаборатория воспроизводимых вычислений
site_description: Публикация результатов учебного эксперимента
site_url: !ENV [SITE_URL, 'http://localhost:8000/']
site_dir: ../site
docs_dir: docs
use_directory_urls: true
theme:
  name: mkdocs
  locale: ru
  color_mode: auto
  highlightjs: false
plugins:
  - search:
      lang: [ru, en]
strict: true
markdown_extensions:
  - attr_list
validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
nav:
  - Эксперимент: index.md
  - Результаты: results/index.md
  - Лицензии: licenses.md
extra_css:
  - assets/lab.css
